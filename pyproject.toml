[project]
name = "swingbird"
version = "0.1.1"
description = "A stand-alone Buzz agent that keeps your projects in full swing."
requires-python = ">=3.12"
dependencies = [
    "bech32>=1.2.0",
    "coincurve>=21.0.0",
    "openai>=3.6.0",
    "websockets>=17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E501"]

[tool.pytest.ini_options]
addopts = "--cov=swingbird --cov-branch --cov-fail-under=100"
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.uv.sources]
crispen = { git = "https://github.com/Voidious/crispen" }

[dependency-groups]
dev = [
    "crispen",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
