[llm]
base_url = "https://api.moonshot.ai/v1"
model = "kimi-k2.6"
api_key_env = "MOONSHOT_API_KEY"

[relay]
url = "wss://relay.example.com"
private_key_env = "SWINGBIRD_PRIVATE_KEY"

[owner]
pubkey = "3aa56890a2f6ca87d91c1dee08b10513ff1887d354fadb4c0b44d7999f4d6f2f"
name = "Voidious"

# The Buzz display name for this daemon's own identity. Updated on startup
# if the identity's current profile name doesn't match. Override in a local
# .swingbird.toml if you want this deployment to show up under a different
# name.
[identity]
name = "swingbird"

# Optional. How long (seconds) to wait for a reply to a relayed instruction
# before giving up on summarizing it back to you. Defaults to 90 if omitted.
# Keep this short if you might ever run swingbird as a voice assistant --
# a reply arriving minutes later, out of nowhere, would be startling.
# [dispatch]
# reply_wait_seconds = 90

# Define your own projects below -- each [[channels]] block is one project.
# `name` is the project name you'll say in conversation ("recap swingbird",
# "tell swingbird to..."), independent of the channel's own Buzz display
# name (which might be "swingbird-dev" or anything else).
#
# This is commented out on purpose: a checkout with no real channels
# defined fails to start with a clear error instead of silently running
# against someone else's project. Put your real entries in a gitignored
# `.swingbird.toml` next to this file (see config.py's module docstring).
# Note that a `channels` key there replaces this section's list outright --
# it doesn't merge per-entry -- so include every project you want active.
#
# [[channels]]
# id = "<buzz channel UUID>"
# name = "swingbird"
# write = true
# agents = ["Sonnet"]
